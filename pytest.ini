# Test-runner configuration. It supersedes [tool.pytest.ini_options] in pyproject.toml, which
# stays byte-identical because frozen CP-2, CP-3, CP-15 and CP-16 records hash that file.
#
# importlib import mode: tests/cp15/test_scoring.py and tests/cp16/test_scoring.py share a
#   basename; the default "prepend" mode cannot collect both and stops the whole run.
# pythonpath: src holds the cp16/cp20 packages, which the wheel does not install; tests holds
#   the conftest helpers that the top-level tests import directly.
[pytest]
testpaths = tests
addopts = --import-mode=importlib
pythonpath = src tests
