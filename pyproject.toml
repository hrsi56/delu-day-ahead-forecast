[project]
name = "delu-price-forecast"
version = "0.1.0"
description = "DE-LU day-ahead electricity price forecasting capstone"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "entsoe-py==0.8.0",
    "holidays>=0.60",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=18.0",
    "requests>=2.31",
    "scipy>=1.14",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/delu_forecast", "src/spike"]

[tool.pytest.ini_options]
testpaths = ["tests"]
