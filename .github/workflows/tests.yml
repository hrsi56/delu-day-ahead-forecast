name: invariant-tests

on:
  push:

jobs:
  properties:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --dev
      - run: uv run pytest -q
      # The §6.2 CQR order-statistic fixture is required on every push from M2.
      # It is inside the run above; naming it separately makes the requirement
      # visible as its own green check rather than implied by a suite total.
      - name: CQR order-statistic fixture (§6.2)
        run: uv run pytest tests/test_10_cqr_order_statistic.py -q
      # CP-3 items 3 and 5, for the same reason: a hiring manager reading four
      # surfaces that disagree, or a static page that phones home, is a release
      # defect and should be a red check rather than a discovery.
      - name: Cross-surface agreement and zero runtime calls (CP-3 items 3, 5)
        run: uv run python scripts/verify_release.py
