name: invariant-tests

on:
  push:

jobs:
  properties:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --dev
      - run: uv run pytest -q
      # The §6.2 CQR order-statistic fixture is required on every push from M2.
      # It is inside the run above; naming it separately makes the requirement
      # visible as its own green check rather than implied by a suite total.
      - name: CQR order-statistic fixture (§6.2)
        run: uv run pytest tests/test_10_cqr_order_statistic.py -q
