# The live product's daily operation on GitHub-hosted macos-26 runners (capstone v21-r20 §24.14; CP-18c item 8; CP-18d
# items 2 and 4), and the dispatch-only dry runs on development days (CP-18a's; CP-18d's rehearsals, item 5).
#
# The daily operation is a self-dispatching chain (CP-18d item 2 and the Orchestrator's ruling O54: fire and forget,
# robust to GitHub's scheduler). GitHub starts scheduled runs late, and under load drops them: the first runner day had
# none fire before the cutoff, and the Orchestrator's schedule probe measured this repository's scheduled runs created
# 6 h 11 min to 7 h 36 min after their cron time on the probe's first night, the delay growing by about half an hour
# each hour (reports/cp18d/schedule-probe.json). O54 asks the operation to keep acquiring and issuing every day when the
# scheduler is late by up to 12 hours or drops most of a day's events. An hourly event through a gate covers any delay
# only while events keep arriving; with most of them dropped, whole days go uncovered (tests/cp18d/test_chain.py). So
# the daily work no longer waits for the scheduler. Each link of the chain is one run started by workflow_dispatch,
# which GitHub starts as soon as the link before it has ended (one concurrency group), and its jobs are:
#   tick     on ubuntu (no macOS runner held): `src/cp18/chain.py tick` (the standard library only) reads the store's run
#            records on main and the previous link's state, and decides what is due and when: D's acquisition from 5.5 h
#            before D's cutoff (04:30 UTC winter, 03:30 UTC summer) until it shows the forecast or reaches the cutoff's
#            margin; the run for the target day 5 min after its cutoff; their retries and backoffs. It sleeps until the
#            action is due, at most 5.75 h, then decides again (the action, or none). A dispatch by hand (live,
#            acquire-live) acts as soon as its tick starts, then continues the chain; it joins the chain's concurrency
#            group, so while a link is running it waits, and the chain's own next link may replace it (that link then
#            does what is due itself).
#   acquire  when the tick says so (macOS): `cp18 acquire` retrieves the next delivery day D's inputs, its tier-3 load
#            forecast above all (shown only by a retrieval before D's cutoff), archives them and pushes live/inputs/
#            through the claim. D's cutoff is D-1 11:00 Europe/Berlin: 10:00 UTC in winter time (CET), 09:00 UTC in
#            summer time (CEST). The TSOs publish the load forecast by D-1 10:00 Berlin (09:00 / 08:00 UTC); on the live
#            record's days it was seen first between 09:03 and 09:17 UTC. It waits inside its job (`--window-hours 6`):
#            it polls until D's load forecast is published, or the cutoff's margin arrives (2 min before it), or its own
#            stop-by (the job's start + 340 min, inside its timeout-minutes 355 and GitHub's 6-hour job limit); then it
#            publishes the archive. An acquisition that finds nothing missing commits nothing.
#   run      when the tick says so (macOS), after the cutoff: `cp18 run --mode live` (the real clock, inside
#            cp18.boundary.live()) issues the target
#            day and decision 23's catch-up through the frozen chain; then, once per as-of day, the dated bundle
#            (`cp18.bundle`, its arrays from this run's own A1 attempt before the results step deletes them, else a
#            refit), the Space build, the publication to the Hugging Face Space, and the day's data-only records
#            pushed through the claim. A target day left open is retried 3 h later, at most three runs for it; a second
#            run finds nothing to issue, records its run and builds no second bundle.
#            Its results keep the Space's whole build, hidden files included, recorded by cp18.runner_artifact before
#            the results step deletes the fitted arrays (CP-18d item 4), so a public check can verify a runner-published
#            Space from the artifact alone.
#   dry-run  workflow_dispatch only (mode dry-run, the default): CP-18a's dry run on development days through 2026-09-06,
#            replayed inputs, fake credentials, the claim's origin a bare repository on the runner; now with the same
#            post-run sequence (the bundle with --arrays, the Space build, a local static publication target, the
#            records through the claim) and a development-day GFS decode in the runner's ecCodes environment. Two
#            rehearsals (CP-18d item 5): late_day, a development day whose load forecast is archived as a retrieval after
#            its cutoff, so the run issues it with the late copy, labelled; move_main, an unrelated commit pushed to the
#            dry run's origin between the records' commit and their push, so the claim must re-apply them.
#   acquire-dry-run  workflow_dispatch only (mode acquire-dry-run): the sleep before the start and the acquisition
#            rehearsed on a development day (through 2026-09-06): the decision at the simulated arrival `now`
#            (src/cp18/window.py, the same start and sleep the tick uses), its sleep for real (at most 20 min here), then
#            replayed responses, a simulated clock continuing from `now`, the load forecast published `published_after`
#            minutes later, the in-job wait and its stop-by (the job's start + 45 min, inside its 60-min limit), the
#            archive pushed to the dry run's bare origin through the claim. Fake credentials only.
#   chain-dry-run  workflow_dispatch only (mode chain-dry-run, `last` = the links left): the self-dispatch rehearsed with
#            no work and no secret: a short sleep, then the next link through workflow_dispatch with the job's token,
#            while links are left, in its own concurrency group.
# A dispatch with mode live or acquire-live acts when its tick starts, then continues the chain (none is needed: O54).
#
#   alert    on ubuntu, `issues: write` (and `contents: read`) only: `src/cp18/alert.py` opens, comments on or closes one
#            GitHub issue per problem (a failed job, a recent day not issued, a recent day issued with the load forecast
#            fetched after the cutoff), so nobody has to watch (O54); GitHub emails the Owner. An issue closes itself once
#            a later day is issued with all inputs before the cutoff. The text carries the day, the cause and the run's
#            link, never a credential.
#   next     on ubuntu, `actions: write` (and `contents: read`) only: `src/cp18/chain.py next` dispatches the next link
#            at once with this link's state (retried; after a failed tick it waits 10 min first).
#   seed     a scheduled event (every hour, and 13:40 UTC): `src/cp18/chain.py seed` dispatches a new chain only if no
#            link is queued or running. A chain breaks only if a dispatch fails or a link is cancelled by hand; any one
#            seed that arrives afterwards, however late, restarts it.
#
# Concurrency, in four groups, none cancelling a run in progress: daily-chain (the chain's links, dispatch chain, live and
# acquire-live), daily-seed (the scheduled events), daily-dry-run (dispatch dry-run and acquire-dry-run) and
# daily-chain-dry-run. GitHub keeps one pending run per group and cancels an older pending one when another queues: so
# at most one chain survives (a second one dies at its next link), and two acquisitions are never in flight together,
# so two never write the same day. The claim (O47) re-applies a pusher's records over a moved main when the moved
# commits touch none of the pusher's own files, and refuses otherwise.
#
# Where the live jobs run: only in hrsi56/delu-day-ahead-forecast, so a copy of this file (the public scratch repository)
# never runs them; and a schedule starts them only while the repository variable DAILY_SCHEDULE is `enabled`. Setting it
# is "enabling the schedule", after the Owner has entered the secrets (`gh variable set DAILY_SCHEDULE --body enabled`).
#
# Credentials (decision 25): ENTSOE_API_TOKEN and HF_TOKEN are repository secrets the Owner enters himself; agents never
# handle their values. Each is read only in the steps that use it: ENTSOE_API_TOKEN in the acquisition and the run,
# HF_TOKEN in the publication, both in the by-value scan of the results before their upload (a found value uploads
# nothing). DAGSHUB_USER_TOKEN is not used. Nothing is at job or workflow level. The checkout keeps no credential
# (persist-credentials: false); a push authenticates through a credential helper that reads DELU_PUSH_TOKEN (the job's
# own token), which only the steps that push hold. The secret guard (.githooks) checks every commit and push against the
# values of every credential-named variable in the pushing process. The dry runs use no secret: fake values derived from
# the run id (cp18.guarddemo.fake_environment), never printed, scanned for by value afterwards.
#
# Permissions: `{}` at the top; `contents: write` only on the jobs that push to main (acquire, run: N6); the dry runs
# read only; `actions: write` only where a run is dispatched or re-enabled (seed, next, the chain's rehearsal,
# keep-alive); `issues: write` only on the alert.
#
# Staying enabled (GitHub disables a scheduled workflow in a public repository after 60 days without repository
# activity): every live run, acquisition included, pushes a data-only commit to main through the claim when it has
# something to record, and every day has some (the day's first acquisition its archive, a run its issuance and its run
# record, which every run pushes whatever it did, the day's bundle records); a later acquisition that finds nothing
# missing commits nothing. That is repository activity. Belt and braces, at no cost and with no external service: the
# keep-alive job, on the 13:40 UTC schedule, re-enables this workflow through GitHub's own API (a no-op while it is
# enabled) and records its state. The chain itself runs on workflow_dispatch, which the 60-day rule does not disable.
# The Owner's decision 29: no local fallback (the launchd files of CP-18c stay uninstalled).
#
# Retrieval is software only, plus the live sources in the live jobs: GitHub's own actions pinned by commit SHA; uv and
# the Python packages uv.lock pins; uv's CPython 3.13.15; CP-20's pinned ecCodes environment
# (reports/weather-admission/scripts/requirements.freeze.txt), recorded by version and content hash; Node.js v26.7.0's
# tarball and SHASUMS256.txt and Pyodide's 23 files, checked by hash.
name: daily
run-name: daily ${{ github.event_name == 'workflow_dispatch' && inputs.mode || format('seed {0}', github.event.schedule) }}

on:
  schedule:
    # The chain's seeds (CP-18d item 2 and the Orchestrator's O54; reports/cp18d/schedule-probe.json): a scheduled event
    # only restarts the chain when no link is queued or running. The daily work itself runs in the chain.
    - cron: '20 * * * *'     # seed: every hour, so that one surviving event, however late, restarts a broken chain
    - cron: '40 13 * * *'    # seed, and the keep-alive
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run (development days, replayed inputs, fake credentials); chain (a link of the daily chain, as the chain dispatches it); live (the run, then the chain); acquire-live (the acquisition, then the chain); acquire-dry-run (the acquisition rehearsed on a development day); chain-dry-run (the self-dispatch rehearsed: last = the links left)'
        type: choice
        options: [dry-run, live, acquire-live, acquire-dry-run, chain, chain-dry-run]
        default: dry-run
      last:
        description: 'chain only: the previous link''s state (JSON), as the chain passes it; chain-dry-run: the links left'
        required: false
        default: ''
      now:
        description: 'dry-run and acquire-dry-run only: the simulated wall clock, ISO 8601 with its offset (a development day''s run; the acquisition rehearsal''s start)'
        required: false
        default: ''
      inputs:
        description: 'dry-run only: live:<recorded responses> (the live-input builder, replayed) or prebuilt:<payloads>'
        required: false
        default: 'live:reports/cp18a/dryrun/recorded'
      store:
        description: 'dry-run only: genesis:<development state>:<first day>, or carried:<a store folder>'
        required: false
        default: 'genesis:reports/cp18a/dryrun/states/start-2026-08-31.json:2026-08-31'
      decode_run:
        description: 'dry-run only: a development GFS run (its day) decoded in the ecCodes environment and compared with the archive ('''' skips)'
        required: false
        default: '2026-09-05'
      day:
        description: 'acquire-live: the delivery day (default: the next one whose cutoff is ahead, within 6 h); acquire-dry-run: the development day (through 2026-09-06, required)'
        required: false
        default: ''
      minutes:
        description: 'dry-run only: the job''s time limit in minutes'
        required: false
        default: '120'
      late_day:
        description: 'dry-run only: a development day whose load forecast is archived as a retrieval after its cutoff, issued with the late copy, labelled ('''' none)'
        required: false
        default: ''
      move_main:
        description: 'dry-run only: true pushes an unrelated commit to the dry run''s origin between the records'' commit and their push (the claim re-applies)'
        type: choice
        options: ['false', 'true']
        default: 'false'
      published_after:
        description: 'acquire-dry-run only: the minutes after the simulated start at which the recorded load forecast is published'
        required: false
        default: '8'

permissions: {}

# Three groups (see the header): daily-dry-run, daily-run (the run crons, as the run job's `if:` lists them, and
# dispatch live), daily-acquire (everything else: the acquisition crons and dispatch acquire-live).
concurrency:
  group: daily-${{ github.event_name == 'schedule' && 'seed' || ((inputs.mode == 'dry-run' || inputs.mode == 'acquire-dry-run') && 'dry-run' || (inputs.mode == 'chain-dry-run' && 'chain-dry-run' || 'chain')) }}
  cancel-in-progress: false

env:
  OPENBLAS_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  MLFLOW_DISABLE_TELEMETRY: "true"
  DO_NOT_TRACK: "1"
  PYTHONPATH: src
  UV_VERSION: "0.12.6"
  CPYTHON: "3.13.15"
  UV_PYTHON_PREFERENCE: only-managed
  WX_FREEZE: reports/weather-admission/scripts/requirements.freeze.txt
  SPACE_HUB: Yarden-Viktor/delu-day-ahead-forecast
  SPACE_HISTORY: reports/cp18c/history-v1/files

jobs:
  dry-run:
    name: macos-26 daily pipeline (dry run, development days)
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run'
    runs-on: macos-26
    timeout-minutes: ${{ fromJSON(inputs.minutes || '120') }}
    permissions:
      contents: read      # the checkout only: a dry run pushes nothing to GitHub (its origin is a bare repository here)
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - &setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - &uv
        name: uv, from PyPI, recorded
        run: |
          mkdir -p "$RUNNER_TEMP/results" "$RUNNER_TEMP/dl"
          echo "RESULTS=$RUNNER_TEMP/results" >> "$GITHUB_ENV"
          # The project named to every step: the issuing host's .local/ (H2's pins) and the ecCodes environment.
          echo "CP17_PROJECT_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "CP26_PROJECT_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          python -m pip install --no-deps --report "$RUNNER_TEMP/results/uv-pip-report.json" "uv==${UV_VERSION}"
          python -m pip download --no-deps --only-binary=:all: -d "$RUNNER_TEMP/dl" "uv==${UV_VERSION}"
          shasum -a 256 "$RUNNER_TEMP"/dl/uv-*.whl > "$RUNNER_TEMP/results/uv-wheel-sha256.txt"
      - &environment
        name: The pinned CPython and the environment uv.lock pins
        run: |
          python -m uv python install "$CPYTHON"
          python -m uv sync --locked --no-install-project --no-dev --python "$CPYTHON"
          python -m uv pip freeze --python .venv > "$RESULTS/uv-freeze.txt"
          shasum -a 256 uv.lock pyproject.toml > "$RESULTS/project-sha256.txt"
          .venv/bin/python -c "import platform, zlib, json; print(json.dumps({'python': platform.python_version(), 'zlib': zlib.ZLIB_RUNTIME_VERSION}))" > "$RESULTS/cpython.json"
      - &ecCodes
        name: The ecCodes environment for GFS decoding (CP-20's pinned versions), recorded by version and content hash
        run: |
          wx="$CP26_PROJECT_ROOT/.local/artifacts/cp-20/wx-venv"     # cp18.live.gfs.WX_PYTHON's venv
          mkdir -p "$RESULTS/wx-env"
          python -m uv venv --quiet --python "$CPYTHON" "$wx"
          python -m uv pip install --python "$wx/bin/python" --no-deps -r "$WX_FREEZE" 2>&1 | tee "$RESULTS/wx-env/install.log"
          python -m uv pip freeze --python "$wx/bin/python" > "$RESULTS/wx-env/freeze.txt"
          .venv/bin/python -m cp18.local wx-env --python "$wx/bin/python" --freeze "$WX_FREEZE" \
              --out "$RESULTS/wx-env/wx-env.json"
      - &guards
        name: The guards on the runner's own commits and pushes (fake credentials, blocked by value)
        run: |
          git config core.hooksPath .githooks
          .venv/bin/python -m cp18.guarddemo --checkout . --work "$RUNNER_TEMP/guard-demo" \
              --run-id "$GITHUB_RUN_ID" --out "$RESULTS/guard-demo.json"
      - name: The pinned states by hash, Pyodide and the official binary retrieved by hash, the package zip rebuilt
        run: |
          .venv/bin/python -m cp18 prepare --root . --project . --pinned reports/cp18a/dryrun/pinned \
              --retrieve-pyodide --retrieve-node --out "$RESULTS/prepare.json"
      - &dry-store
        name: The dry run's store and its origin, on the runner (the live record set aside in this throwaway checkout)
        env:
          STORE: ${{ inputs.store }}
        run: |
          # The product's live record (live/) never enters a dry run: it is removed from this checkout and from the
          # dry run's seed commit, so the bare origin holds the dry run's own store only. Nothing touches GitHub.
          git rm -r -q --ignore-unmatch -- live
          rm -rf live
          case "$STORE" in
            genesis:*) .venv/bin/python -m cp18 seed-store --root . --genesis "${STORE#genesis:}" ;;
            carried:*) .venv/bin/python -m cp18 seed-store --root . --carried "${STORE#carried:}" ;;
            *) echo "store: expected genesis:<state>:<first day> or carried:<folder>" >&2; exit 2 ;;
          esac
          git add live/store
          git -c user.name=delu-daily -c user.email=delu-daily@users.noreply.github.com commit --quiet \
              -m "dry run: the store at its start"
          # The checkout is shallow, so the origin starts from one parentless commit of the same tree.
          seed=$(git -c user.name=delu-daily -c user.email=delu-daily@users.noreply.github.com commit-tree "HEAD^{tree}" \
              -m "dry run: this checkout's tree and the store at its start")
          git init --quiet --bare -b main "$RUNNER_TEMP/origin.git"
          git remote add dryrun "$RUNNER_TEMP/origin.git"
          git push --quiet dryrun "$seed:refs/heads/main"
      - name: The pipeline (dry run, development days)
        id: run
        env:
          NOW: ${{ inputs.now }}
          INPUTS: ${{ inputs.inputs }}
          LATE_DAY: ${{ inputs.late_day }}
        run: |
          [ -n "$NOW" ] || { echo "a dry run needs the input now (its simulated wall clock)" >&2; exit 2; }
          # The late-copy rehearsal (CP-18d item 5): a development day only, through 2026-09-06.
          [ -z "$LATE_DAY" ] || { [[ "$LATE_DAY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] && [[ ! "$LATE_DAY" > 2026-09-06 ]]; } || \
              { echo "late_day: a development day (YYYY-MM-DD, through 2026-09-06)" >&2; exit 2; }
          # Fake credentials in the consuming process only, derived from the run id and never printed.
          eval "$(.venv/bin/python -c "from cp18.guarddemo import fake_environment as f; import os, shlex; [print(f'export {k}={shlex.quote(v)}') for k, v in f(os.environ.get('GITHUB_RUN_ID', '')).items()]")"
          set +e -o pipefail
          .venv/bin/python -m cp18 run --root . --project . --out "$RESULTS/run" --host runner --now "$NOW" \
              --inputs "$INPUTS" --remote dryrun --run-label "gh-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
              ${LATE_DAY:+--late-day "$LATE_DAY"} 2>&1 | tee "$RESULTS/run.log"
          code=$?
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          [ "$code" != 1 ] || echo "::warning title=Not issued::a day was not issued; its cause is in the run record"
          case "$code" in 0|1) exit 0 ;; *) exit "$code" ;; esac
      - name: The bundle's plan (once per as-of day; the served day's A1 arrays from this run, else a refit)
        id: plan
        env:
          NOW: ${{ inputs.now }}
        run: .venv/bin/python -m cp18.local bundle-plan --root . --runs "$RESULTS/run/runs" --now "$NOW" | tee -a "$GITHUB_OUTPUT"
      - name: The dated bundle, before the results step deletes the arrays (exit 0 publishable, 1 refused)
        id: bundle
        if: steps.plan.outputs.build == 'true'
        env:
          NOW: ${{ steps.plan.outputs.now }}
          HOW: ${{ steps.plan.outputs.how }}
          ARRAYS: ${{ steps.plan.outputs.arrays }}
          INPUTS: ${{ inputs.inputs }}
        run: |
          case "$HOW" in arrays) how=(--arrays "$ARRAYS") ;; refit) how=(--refit) ;; *) how=() ;; esac
          extra=()
          [ ! -d "$RESULTS/run/payloads" ] || extra+=(--cache "$RESULTS/run/payloads")
          case "$INPUTS" in live:*) extra+=(--recorded "${INPUTS#live:}") ;; esac
          set +e -o pipefail
          .venv/bin/python -m cp18.bundle --root . --project . --now "$NOW" --out "$RESULTS/bundle" "${how[@]}" \
              "${extra[@]}" --record "$RESULTS/bundle-record.json" --commit-records \
              --run-id "gh-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" 2>&1 | tee "$RESULTS/bundle.log"
          code=$?
          echo "publishable=$([ "$code" = 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: The Space, from the bundle
        id: space
        if: steps.bundle.outputs.publishable == 'true'
        run: |
          extra=()
          [ ! -d "$SPACE_HISTORY" ] || extra+=(--history "$SPACE_HISTORY")
          ! grep -q "'--live'" scripts/build_product_space.py || extra+=(--live live)
          .venv/bin/python scripts/build_product_space.py --bundle "$RESULTS/bundle" --out "$RESULTS/space" "${extra[@]}"
      - name: The publication, to a local static target (a dry run never publishes to the Space)
        id: publish
        if: steps.space.outcome == 'success'
        run: |
          .venv/bin/python -m cp18.publish --build "$RESULTS/space" --bundle "$RESULTS/bundle" --target "$RUNNER_TEMP/served" \
              --root . --live live --record "$RESULTS/publication.json"
      - name: The day's records, committed and pushed through the claim (to the dry run's origin)
        if: ${{ !cancelled() && steps.run.outcome == 'success' }}
        env:
          MOVE_MAIN: ${{ inputs.move_main }}
        run: |
          # The moved-main rehearsal (CP-18d item 5): an unrelated commit reaches the dry run's origin between the
          # records' commit and their push, so the claim must re-apply them (O47).
          extra=()
          [ "$MOVE_MAIN" != true ] || extra+=(--rehearse-moved-main)
          .venv/bin/python -m cp18.local records --root . --remote dryrun --run-id "gh-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
              --out "$RESULTS/records.json" "${extra[@]}"
      - name: A development-day GFS run decoded in the runner's ecCodes environment, against the archived decode
        if: ${{ !cancelled() && inputs.decode_run != '' }}
        env:
          RUN: ${{ inputs.decode_run }}
        run: |
          .venv/bin/python -m cp18.local decode-check --run "$RUN" \
              --python "$CP26_PROJECT_ROOT/.local/artifacts/cp-20/wx-venv/bin/python" \
              --archived reports/cp18a/dryrun/recorded/gfs --work "$RUNNER_TEMP/decode" --out "$RESULTS/decode-check.json"
          mkdir -p "$RESULTS/decode" && cp "$RUNNER_TEMP"/decode/decoded/runs/* "$RESULTS/decode/"
      - name: The dry run's store and records, carried out of the runner
        if: always()
        run: |
          git -C "$RUNNER_TEMP/origin.git" bundle create "$RESULTS/origin.bundle" main || true
          git -C "$RUNNER_TEMP/origin.git" archive --format=tar main live | tar -x -C "$RESULTS" || true
          rm -rf "$RESULTS/space/pyodide" "$RESULTS/space/bundle" "$RESULTS/space/history" "$RESULTS/space/payloads" || true
      - &fake-scan
        name: No fake credential in any result (by value)
        if: always()
        run: .venv/bin/python -m cp18.guarddemo scan --run-id "$GITHUB_RUN_ID" "$RESULTS" > "$RUNNER_TEMP/scan.json"; cat "$RUNNER_TEMP/scan.json"
      - &hashes
        name: The results' own hashes (the fitted arrays deleted first)
        if: always()
        run: |
          find "$RESULTS" -type f -name '*-arrays.npz' -delete
          (cd "$RESULTS" && find . -type f ! -name results-sha256.txt -print0 | sort -z | xargs -0 shasum -a 256 > results-sha256.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: pipeline
          path: ${{ env.RESULTS }}
          retention-days: 30
          if-no-files-found: error

  acquire-dry-run:
    name: macos-26 acquisition rehearsal (dry run, development days)
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'acquire-dry-run'
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read      # the checkout only: the rehearsal's archive goes to a bare repository on the runner
    steps:
      - name: The job's start and its stop-by (the start + 45 min, inside the rehearsal's 60-min limit)
        env:
          STOP_AFTER_MINUTES: '45'
        run: |
          start=$(date -u +%s)
          echo "JOB_START=$(date -u -r "$start" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "STOP_BY=$(date -u -r "$start" -v+"${STOP_AFTER_MINUTES}"M +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "started $(date -u -r "$start" +%Y-%m-%dT%H:%M:%SZ); polling ends by $(date -u -r "$start" -v+"${STOP_AFTER_MINUTES}"M +%Y-%m-%dT%H:%M:%SZ)"
      - *checkout
      - *setup-python
      - *uv
      - name: The gate rehearsed at the simulated arrival `now` (src/cp18/window.py); an early event sleeps, for real (at most 20 min here)
        id: gate
        env:
          DAY: ${{ inputs.day }}
          NOW: ${{ inputs.now }}
        run: |
          [ -n "$DAY" ] && [ -n "$NOW" ] || { echo "an acquisition rehearsal needs the inputs day and now" >&2; exit 2; }
          # Development days only, through 2026-09-06 (cp18 acquire refuses later days too).
          { [[ "$DAY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] && [[ ! "$DAY" > 2026-09-06 ]] && [[ ! "${NOW:0:10}" > 2026-09-06 ]]; } || \
              { echo "day and now: a development day (YYYY-MM-DD, through 2026-09-06)" >&2; exit 2; }
          echo "GATE_EPOCH=$(date -u +%s)" >> "$GITHUB_ENV"
          python3 src/cp18/window.py --now "$NOW" | tee "$RESULTS/gate.txt"
          cat "$RESULTS/gate.txt" >> "$GITHUB_OUTPUT"
          grep -qx "day=$DAY" "$RESULTS/gate.txt" || { echo "the gate names another day than $DAY" >&2; exit 2; }
          sleep_s=$(sed -n 's/^sleep_seconds=//p' "$RESULTS/gate.txt")
          [ "$sleep_s" -le 1200 ] || { echo "a rehearsal arrival may be at most 20 min before the start" >&2; exit 2; }
          if grep -qx 'go=true' "$RESULTS/gate.txt" && [ "$sleep_s" != 0 ]; then
            echo "sleeping ${sleep_s} s, as the live gate would"; sleep "$sleep_s"
          fi
      - *environment
      - *ecCodes
      - *guards
      - *dry-store
      - name: The acquisition rehearsed (a development day, replayed responses, a simulated clock, the in-job wait)
        id: acquire
        if: steps.gate.outputs.go == 'true'
        env:
          DAY: ${{ inputs.day }}
          NOW: ${{ inputs.now }}
          AFTER: ${{ inputs.published_after }}
        run: |
          # The simulated clock continues from the gate's arrival `now` through the real time since (its sleep included).
          CLOCK_START=$(python3 -c "import datetime as d, os, time; n = d.datetime.fromisoformat(os.environ['NOW'].replace('Z', '+00:00')); print((n + d.timedelta(seconds=int(time.time()) - int(os.environ['GATE_EPOCH']))).isoformat())")
          echo "the acquisition's simulated start: $CLOCK_START"
          NOW="$CLOCK_START"
          # Fake credentials in the consuming process only, derived from the run id and never printed.
          eval "$(.venv/bin/python -c "from cp18.guarddemo import fake_environment as f; import os, shlex; [print(f'export {k}={shlex.quote(v)}') for k, v in f(os.environ.get('GITHUB_RUN_ID', '')).items()]")"
          set +e -o pipefail
          .venv/bin/python -m cp18 acquire --root . --out "$RESULTS/acquire.json" --remote dryrun \
              --rehearsal reports/cp18a/dryrun/recorded --day "$DAY" --clock-start "$NOW" \
              --published-after-minutes "$AFTER" --poll-seconds 60 --margin-seconds 120 --window-hours 6 \
              --stop-by "$STOP_BY" 2>&1 | tee "$RESULTS/acquire.log"
          code=$?
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          [ "$code" != 1 ] || echo "::warning title=Not shown::the load forecast was not shown before the cutoff or the stop-by"
          case "$code" in 0|1) exit 0 ;; *) exit "$code" ;; esac
      - name: The rehearsal's archive and records, carried out of the runner
        if: always()
        run: |
          git -C "$RUNNER_TEMP/origin.git" bundle create "$RESULTS/origin.bundle" main || true
          git -C "$RUNNER_TEMP/origin.git" archive --format=tar main live | tar -x -C "$RESULTS" || true
      - *fake-scan
      - *hashes
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: acquire-dry-run
          path: ${{ env.RESULTS }}
          retention-days: 30
          if-no-files-found: error

  seed:
    name: Seed the chain (a scheduled event restarts it only if no link is queued or running)
    if: >-
      github.repository == 'hrsi56/delu-day-ahead-forecast' && github.event_name == 'schedule' &&
      vars.DAILY_SCHEDULE == 'enabled'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read      # the chain's two files
      actions: write      # list this workflow's runs, and dispatch the chain's first link
    steps:
      - &chain-files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            src/cp18/chain.py
            src/cp18/window.py
            src/cp18/alert.py
          sparse-checkout-cone-mode: false
      - name: A new chain, only if none is alive (src/cp18/chain.py seed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 src/cp18/chain.py seed --repo "$GITHUB_REPOSITORY"

  tick:
    name: The chain's tick (what is due, and a sleep on Linux until it is due, at most 5.75 h)
    if: >-
      github.repository == 'hrsi56/delu-day-ahead-forecast' && github.event_name == 'workflow_dispatch' && (
        inputs.mode == 'live' || inputs.mode == 'acquire-live' ||
        (inputs.mode == 'chain' && vars.DAILY_SCHEDULE == 'enabled'))
    runs-on: ubuntu-24.04
    timeout-minutes: 355  # a sleep of at most 5.75 h (window.py's MAX_SLEEP_HOURS), inside GitHub's 6-hour job limit
    permissions:
      contents: read      # the chain's files and the store's run records on main
    outputs:
      action: ${{ steps.tick.outputs.action }}
      day: ${{ steps.tick.outputs.day }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: main
          sparse-checkout: |
            src/cp18/chain.py
            src/cp18/window.py
            live/store/runs
          sparse-checkout-cone-mode: false
      - name: What is due, and when (src/cp18/chain.py tick; a dispatch by hand acts when it starts)
        id: tick
        env:
          LAST: ${{ inputs.last }}
          MODE: ${{ inputs.mode }}
        run: |
          force=()
          case "$MODE" in live) force=(--force run) ;; acquire-live) force=(--force acquire) ;; esac
          python3 src/cp18/chain.py tick --store live/store --last "$LAST" "${force[@]}" --sleep >> "$GITHUB_OUTPUT"

  chain-dry-run:
    name: The chain's self-dispatch rehearsed (no work, no secret; a short sleep, then the next link)
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'chain-dry-run'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read      # the chain's files
      actions: write      # dispatch the next rehearsed link
    steps:
      - *chain-files
      - name: A link, then the next one while links are left (`last` is the number of links left)
        env:
          GH_TOKEN: ${{ github.token }}
          LEFT: ${{ inputs.last }}
        run: |
          [[ "${LEFT:-0}" =~ ^[0-9]+$ ]] || { echo "last: the number of links left" >&2; exit 2; }
          echo "a rehearsed link, $LEFT left"; sleep 30
          [ "${LEFT:-0}" -gt 0 ] || { echo "the rehearsed chain ends here"; exit 0; }
          python3 src/cp18/chain.py next --repo "$GITHUB_REPOSITORY" --mode chain-dry-run --links "$((LEFT - 1))"

  acquire:
    name: macos-26 acquisition before the cutoff (live)
    needs: tick
    # After the tick (which holds the event, repository and schedule conditions): only when it says so.
    if: needs.tick.outputs.action == 'acquire'
    runs-on: macos-26
    timeout-minutes: 355  # GitHub's 6-hour job limit, less a margin for the publication after the stop-by
    permissions:
      contents: write     # the day's data-only commit of live/inputs/ to main, through the claim (N6)
    outputs:
      shown: ${{ steps.outcome.outputs.shown }}
      stopped: ${{ steps.outcome.outputs.stopped }}
    steps:
      - name: The job's start and its stop-by (the start + 340 min; polling ends there, then the archive is published)
        env:
          STOP_AFTER_MINUTES: '340'
        run: |
          start=$(date -u +%s)
          echo "JOB_START=$(date -u -r "$start" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "STOP_BY=$(date -u -r "$start" -v+"${STOP_AFTER_MINUTES}"M +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "started $(date -u -r "$start" +%Y-%m-%dT%H:%M:%SZ); polling ends by $(date -u -r "$start" -v+"${STOP_AFTER_MINUTES}"M +%Y-%m-%dT%H:%M:%SZ)"
      - *checkout
      - *setup-python
      - *uv
      - *environment
      - *ecCodes
      - &claim
        name: The claim's checkout - the repository's guards active, a push credential only where a step holds one
        run: |
          git config core.hooksPath .githooks
          git config credential.https://github.com.helper \
              '!f() { test "$1" = get || exit 0; echo username=x-access-token; echo "password=${DELU_PUSH_TOKEN:?}"; }; f'
      - name: The acquisition before the cutoff (live; nothing when the next cutoff is more than 6 h away; it waits until the forecast, the cutoff's margin or the stop-by)
        id: acquire
        env:
          ENTSOE_API_TOKEN: ${{ secrets.ENTSOE_API_TOKEN }}
          DELU_PUSH_TOKEN: ${{ github.token }}
          DAY: ${{ inputs.day }}
        run: |
          .venv/bin/python -m cp18 acquire --root . --out "$RESULTS/acquire.json" --remote origin --window-hours 6 \
              --stop-by "$STOP_BY" ${DAY:+--day "$DAY"}
      - name: The acquisition's outcome, for the chain's next link (shown, and why it stopped)
        id: outcome
        if: always()
        run: |
          .venv/bin/python -c "import json, sys; r = json.load(open(sys.argv[1])); print('shown=' + str(bool((r.get('load_forecast') or {}).get('shown'))).lower()); print('stopped=' + (r.get('stopped') or ''))" \
              "$RESULTS/acquire.json" >> "$GITHUB_OUTPUT" || true
      - &scan
        name: No credential in any result (by value; a found value uploads nothing)
        id: scan
        if: always()
        env:
          ENTSOE_API_TOKEN: ${{ secrets.ENTSOE_API_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          DELU_PUSH_TOKEN: ${{ github.token }}
        run: |
          .venv/bin/python -m cp18.local scan --name ENTSOE_API_TOKEN --name HF_TOKEN --name DELU_PUSH_TOKEN \
              --out "$RUNNER_TEMP/scan.json" "$RESULTS"
      - *hashes
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: ${{ !cancelled() && steps.scan.outcome == 'success' }}
        with:
          name: daily
          path: ${{ env.RESULTS }}
          retention-days: 30
          if-no-files-found: error

  run:
    name: macos-26 daily pipeline (live)
    needs: tick
    # After the tick (which holds the event, repository and schedule conditions): only when it says so.
    if: needs.tick.outputs.action == 'run'
    runs-on: macos-26
    timeout-minutes: 150
    permissions:
      contents: write     # the day's data-only records to main, through the claim (N6)
    steps:
      - *checkout
      - *setup-python
      - *uv
      - *environment
      - *ecCodes
      - *guards
      - *claim
      - name: The pinned states by hash, Pyodide and the official binary retrieved by hash, the package zip rebuilt
        run: |
          .venv/bin/python -m cp18 prepare --root . --project . --pinned live/pinned \
              --retrieve-pyodide --retrieve-node --out "$RESULTS/prepare.json"
      - name: The pipeline (live, the real clock)
        id: run
        env:
          ENTSOE_API_TOKEN: ${{ secrets.ENTSOE_API_TOKEN }}
          DELU_PUSH_TOKEN: ${{ github.token }}
        run: |
          set +e -o pipefail
          .venv/bin/python -m cp18 run --root . --project . --out "$RESULTS/run" --host runner --mode live \
              --inputs live-http --remote origin --run-label "gh-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" 2>&1 | tee "$RESULTS/run.log"
          code=$?
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          [ "$code" != 1 ] || echo "::warning title=Not issued::a day was not issued; its cause is in the store"
          case "$code" in 0|1) exit 0 ;; *) exit "$code" ;; esac
      - name: The bundle's plan (once per as-of day; the served day's A1 arrays from this run, else a refit)
        id: plan
        run: |
          .venv/bin/python -m cp18.local bundle-plan --mode live --root . --runs "$RESULTS/run/runs" \
              --now "$(date -u +%Y-%m-%dT%H:%M:%S+00:00)" | tee -a "$GITHUB_OUTPUT"
      - name: The dated bundle, before the results step deletes the arrays (exit 0 publishable, 1 refused)
        id: bundle
        if: steps.plan.outputs.build == 'true'
        env:
          NOW: ${{ steps.plan.outputs.now }}
          HOW: ${{ steps.plan.outputs.how }}
          ARRAYS: ${{ steps.plan.outputs.arrays }}
        run: |
          case "$HOW" in arrays) how=(--arrays "$ARRAYS") ;; refit) how=(--refit) ;; *) how=() ;; esac
          extra=()
          [ ! -d "$RESULTS/run/payloads" ] || extra+=(--cache "$RESULTS/run/payloads")
          set +e -o pipefail
          .venv/bin/python -m cp18.bundle --root . --project . --mode live --now "$NOW" --out "$RESULTS/bundle" \
              "${how[@]}" "${extra[@]}" --record "$RESULTS/bundle-record.json" --commit-records \
              --run-id "gh-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" 2>&1 | tee "$RESULTS/bundle.log"
          code=$?
          echo "publishable=$([ "$code" = 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: The Space, from the bundle
        id: space
        if: steps.bundle.outputs.publishable == 'true'
        run: |
          .venv/bin/python scripts/build_product_space.py --bundle "$RESULTS/bundle" --out "$RESULTS/space" --live live \
              --history "$SPACE_HISTORY"
      - name: The publication to the Hugging Face Space, then the served identity read back
        id: publish
        if: steps.space.outcome == 'success'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # The Hub client, pinned, in an ephemeral overlay over the project's environment (never synced or changed):
          # cp18.publish.HUB_CLIENT, as v1's deployment pinned it.
          UV_PROJECT_ENVIRONMENT=.venv python -m uv run --frozen --no-sync --with "huggingface_hub==0.36.2" \
              python -m cp18.publish --build "$RESULTS/space" --bundle "$RESULTS/bundle" --hub "$SPACE_HUB" \
              --root . --live live --record "$RESULTS/publication.json"
      - name: The day's records, committed and pushed through the claim
        if: ${{ !cancelled() && steps.run.outcome == 'success' }}
        env:
          DELU_PUSH_TOKEN: ${{ github.token }}
        run: |
          .venv/bin/python -m cp18.local records --root . --remote origin --run-id "gh-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
              --out "$RESULTS/records.json"
      - name: The Space's whole build recorded for the artifact, before the results step deletes its fitted arrays
        if: ${{ !cancelled() && steps.space.outcome == 'success' }}
        run: |
          # The results keep the whole build (CP-18d item 4): every file of its own record with its hash, and the
          # fitted arrays the next steps delete on purpose, so a public check verifies the published Space from the
          # artifact alone (python -m cp18.runner_artifact verify --artifact <the downloaded results>).
          .venv/bin/python -m cp18.runner_artifact record --build "$RESULTS/space" --out "$RESULTS/space-artifact.json"
      - *scan
      - *hashes
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: ${{ !cancelled() && steps.scan.outcome == 'success' }}
        with:
          name: daily
          path: ${{ env.RESULTS }}
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: true    # the build's .gitattributes files (PRES-6's landing record: the dotfile dropped)

  alert:
    name: The alert (one issue per problem, opened, commented on, or closed by a later healthy day)
    needs: [tick, acquire, run]
    if: always() && github.repository == 'hrsi56/delu-day-ahead-forecast' && needs.tick.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read      # the alert's files and the store on main, after this link's records
      issues: write       # open, comment on, close the alert's issues, and nothing more
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: main
          sparse-checkout: |
            src/cp18/alert.py
            src/cp18/chain.py
            src/cp18/window.py
            live/store/ledger.jsonl
            live/store/issued
          sparse-checkout-cone-mode: false
      - name: Open, comment on or close the alert's issues (src/cp18/alert.py; no credential in any text)
        env:
          GH_TOKEN: ${{ github.token }}
          TICK: ${{ needs.tick.result }}
          ACQUIRE: ${{ needs.acquire.result }}
          RUN: ${{ needs.run.result }}
          DAY: ${{ needs.tick.outputs.day }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          failed=()
          [ "$TICK" != failure ] || failed+=(--failed tick)
          [ "$ACQUIRE" != failure ] || failed+=(--failed acquisition)
          [ "$RUN" != failure ] || failed+=(--failed run)
          python3 src/cp18/alert.py --repo "$GITHUB_REPOSITORY" --store live/store --run-url "$RUN_URL" --day "$DAY" \
              "${failed[@]}"

  next:
    name: The chain's next link (dispatched at once, with this link's state)
    needs: [tick, acquire, run, alert]
    if: >-
      always() && github.repository == 'hrsi56/delu-day-ahead-forecast' && vars.DAILY_SCHEDULE == 'enabled' &&
      needs.tick.result != 'skipped' && needs.tick.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read      # the chain's files
      actions: write      # dispatch the next link, and nothing more
    steps:
      - *chain-files
      - name: The next link (src/cp18/chain.py next; retried; a failed tick waits 10 min first)
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ needs.tick.outputs.action }}
          DAY: ${{ needs.tick.outputs.day }}
          TICK: ${{ needs.tick.result }}
          ACQUIRE: ${{ needs.acquire.result }}
          RUN: ${{ needs.run.result }}
          SHOWN: ${{ needs.acquire.outputs.shown }}
          STOPPED: ${{ needs.acquire.outputs.stopped }}
        run: |
          [ "$TICK" = success ] || { echo "the tick did not succeed: the next link waits 10 min"; sleep 600; }
          python3 src/cp18/chain.py next --repo "$GITHUB_REPOSITORY" --action "$ACTION" --day "$DAY" \
              --tick-result "$TICK" --acquire-result "$ACQUIRE" --run-result "$RUN" --shown "$SHOWN" --stopped "$STOPPED"

  keep-alive:
    name: The schedule stays enabled (belt and braces)
    if: >-
      github.repository == 'hrsi56/delu-day-ahead-forecast' && github.event_name == 'schedule' &&
      vars.DAILY_SCHEDULE == 'enabled' && github.event.schedule == '40 13 * * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write      # PUT .../actions/workflows/daily.yml/enable, and nothing else
    steps:
      - name: Re-enable this workflow through GitHub's own API (a no-op while it is enabled), and record its state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/daily.yml/enable"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/daily.yml" --jq '{state, updated_at}'
